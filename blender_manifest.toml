schema_version = "1.0.0"

id = "slide_tools"
version = "0.3.0"
name = "Slide Tools"
tagline = "Rotate, scale, flatten, or curve a mesh selection while vertices slide on connected edges"
maintainer = "Aleksandr 'Sasha' Motsjonov"
type = "add-on"

blender_version_min = "5.1.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

tags = ["3D View", "Mesh"]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.cursor/",
  "/.venv/",
  "/.pytest_cache/",
  "/*.zip",
  "/scripts/",
  "/tests/",
  "/docs/",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/MILESTONES.md",
  "/requirements-dev.txt",
]
