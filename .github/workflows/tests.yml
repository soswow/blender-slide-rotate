name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: ./scripts/run-unittests.sh

  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "5.1.2"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.BLENDER_VERSION }}
      - name: Blender smoke test
        run: blender --factory-startup --disable-autoexec -b --python-exit-code 1 --python scripts/validate_addon.py
