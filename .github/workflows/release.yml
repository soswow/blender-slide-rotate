name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLENDER_VERSION: "5.1.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Tag must be vMAJOR.MINOR.PATCH, got ${TAG}" >&2
              exit 1
              ;;
          esac
          grep -q "^version = \"${VERSION}\"" blender_manifest.toml
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt
          ./scripts/run-unittests.sh

      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.BLENDER_VERSION }}

      - name: Validate and build extension zip
        run: |
          blender --factory-startup --command extension validate
          blender --factory-startup --command extension build
          ls -lh slide_tools-${{ steps.version.outputs.version }}*.zip

      - name: Release notes
        run: |
          python3 scripts/changelog.py notes "${{ steps.version.outputs.version }}" \
            > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            slide_tools-${{ steps.version.outputs.version }}*.zip \
            --title "Slide Tools ${{ steps.version.outputs.version }}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
